name: CI

on:
  push:
  pull_request:
    branches:
      - main
      - dev_branch

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: Frontend build & test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage

  api:
    runs-on: ubuntu-latest
    name: API test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
        working-directory: api
      - run: npm run test:coverage
        working-directory: api
